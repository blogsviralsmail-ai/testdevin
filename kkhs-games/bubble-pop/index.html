<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KKHS Bubble Pop</title>
  <script src="https://connect.facebook.net/en_US/fbinstant.8.0.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui-overlay">
    <div id="loading-screen">
      <div class="brand">KKHS Games</div>
      <div class="game-title">Bubble Pop</div>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loadingBar"></div>
      </div>
      <div class="loading-text">Loading...</div>
    </div>
    <div id="menu-screen" class="hidden">
      <div class="brand">KKHS Games</div>
      <div class="game-title">Bubble Pop</div>
      <div class="best-score">Best: <span id="bestScore">0</span></div>
      <button id="playBtn" class="btn-primary">PLAY</button>
      <button id="leaderboardBtn" class="btn-secondary">Leaderboard</button>
      <div class="sound-toggle" id="soundToggle">Sound: ON</div>
    </div>
    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="combo-display" id="comboDisplay"></div>
      </div>
    </div>
    <div id="game-over-screen" class="hidden">
      <div class="game-over-title">Game Over!</div>
      <div class="final-score">Score: <span id="finalScore">0</span></div>
      <div class="new-best hidden" id="newBest">NEW BEST!</div>
      <button id="retryBtn" class="btn-primary">Play Again</button>
      <button id="shareBtn" class="btn-secondary">Share Score</button>
      <button id="menuBtn" class="btn-secondary">Menu</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
