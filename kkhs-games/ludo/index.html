<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KKHS Ludo</title>
  <script src="https://connect.facebook.net/en_US/fbinstant.8.0.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui-overlay">
    <div id="loading-screen">
      <div class="brand">KKHS Games</div>
      <div class="game-title">Ludo Star</div>
      <div class="loading-bar-container">
        <div class="loading-bar" id="loadingBar"></div>
      </div>
      <div class="loading-text">Loading...</div>
    </div>
    <div id="menu-screen" class="hidden">
      <div class="brand">KKHS Games</div>
      <div class="game-title">Ludo Star</div>
      <div class="subtitle">Classic Board Game</div>
      <div class="best-score">Wins: <span id="bestScore">0</span></div>
      <div class="player-select">
        <button class="player-btn active" data-players="2">2 Players</button>
        <button class="player-btn" data-players="4">4 Players</button>
      </div>
      <button id="playBtn" class="btn-primary">PLAY</button>
      <button id="shareBtn2" class="btn-secondary">Invite Friends</button>
      <div class="sound-toggle" id="soundToggle">Sound: ON</div>
    </div>
    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="turn-display" id="turnDisplay">Your Turn</div>
        <div class="dice-btn" id="diceBtn">Roll</div>
      </div>
      <div class="dice-result" id="diceResult"></div>
    </div>
    <div id="game-over-screen" class="hidden">
      <div class="game-over-title" id="winTitle">You Win!</div>
      <div class="final-score">Total Wins: <span id="finalScore">0</span></div>
      <button id="retryBtn" class="btn-primary">Play Again</button>
      <button id="shareBtn" class="btn-secondary">Share</button>
      <button id="menuBtn" class="btn-secondary">Menu</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
