<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — VideoByte</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--coral:#E85D3A;--dark:#1C1C28;--gray:#6B7280}
body{font-family:'Inter',sans-serif;background:#F9FAFB;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
.logo svg{width:36px;height:36px}
.logo span{font-size:22px;font-weight:800;color:var(--dark)}
.subtitle{text-align:center;color:var(--gray);font-size:14px;margin-bottom:32px}
label{display:block;font-size:12px;font-weight:600;color:var(--dark);margin-bottom:6px}
input[type="email"],input[type="password"],input[type="text"]{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border .2s;box-sizing:border-box}
input:focus{border-color:var(--coral)}
.field{margin-bottom:18px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{background:#D04F30}
.btn-coral:disabled{opacity:.5;cursor:not-allowed}
.divider{text-align:center;color:var(--gray);font-size:12px;margin:20px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:calc(50% - 20px);height:1px;background:#E5E7EB}
.divider::before{left:0}
.divider::after{right:0}
.btn-google{width:100%;padding:12px;border:1.5px solid #E5E7EB;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;color:var(--dark)}
.btn-google:hover{border-color:var(--coral)}
.links{text-align:center;margin-top:20px;font-size:13px;color:var(--gray)}
.links a{color:var(--coral);font-weight:600}
.err{display:none;background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>

<div class="card">
    <div class="logo">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#E85D3A"/><polygon points="13,9 13,23 24,16" fill="white"/></svg>
        <span>VideoByte</span>
    </div>
    <p class="subtitle">Sign in to your account</p>

    <div id="errBox" class="err"></div>

    <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-coral" id="loginBtn" onclick="doLogin()">Sign In</button>

    <div class="divider">or</div>

    <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09a7.12 7.12 0 010-4.17V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
    </button>

    <div class="links">
        <a href="signup.html">Create an account</a> &nbsp;·&nbsp; <a href="signup.html#forgot">Forgot password?</a>
    </div>
</div>

<script>
function showErr(msg){var e=document.getElementById('errBox');e.textContent=msg;e.style.display='block';}
function hideErr(){document.getElementById('errBox').style.display='none';}

function doLogin(){
    hideErr();
    var email=document.getElementById('email').value.trim();
    var pass=document.getElementById('password').value;
    if(!email||!pass){showErr('Please enter email and password.');return;}
    var btn=document.getElementById('loginBtn');
    btn.disabled=true;btn.textContent='Signing in…';
    fetch('auth.php?action=login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email,password:pass})})
    .then(function(r){return r.json();})
    .then(function(d){
        if(d.ok){
            localStorage.setItem('vb_auth',JSON.stringify({email:d.user.email,name:d.user.name,role:d.user.role,token:d.token}));
            window.location.href=d.user.role==='admin'?'admin.html':'user.html';
        } else {
            if(d.error==='unverified'){window.location.href='signup.html?verify='+encodeURIComponent(email);return;}
            showErr(d.message||'Login failed.');
            btn.disabled=false;btn.textContent='Sign In';
        }
    })
    .catch(function(){showErr('Network error.');btn.disabled=false;btn.textContent='Sign In';});
}

function googleLogin(){window.location.href='google_login.php';}

document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

// Auto-redirect if already logged in
(function(){
    var auth=localStorage.getItem('vb_auth');
    if(auth){
        try{var u=JSON.parse(auth);if(u.token)fetch('auth.php?action=me',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){if(d.ok){window.location.href=d.user.role==='admin'?'admin.html':'user.html';}});}catch(e){}
    }
})();
</script>

</body>
</html>
