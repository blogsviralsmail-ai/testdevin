<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopicGuru – Lesson Content</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../images/icon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="../index.html" class="nav-logo">
      <img src="../images/icon.png" alt="TopicGuru">
      <span>Topic<span class="highlight">Guru</span></span>
    </a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Sign Up</a>
    </div>
    <div class="hamburger" onclick="toggleMobileMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="page-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="javascript:history.back()" class="back-btn">&#8592; Back to Chapters</a>
      <div class="class-badge">
        <div class="badge-num" id="badge-num"></div>
        <div class="badge-text" id="badge-text">
          <strong id="content-title">Lesson</strong>
          <span id="content-title-en"></span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="../index.html">&#127968; Home</a>
        <a href="#" onclick="switchTab('content')" class="active">&#128196; Content</a>
        <a href="#" onclick="switchTab('quiz')">&#9889; Quiz</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="breadcrumb">
        <a href="../index.html">Home</a>
        <span>&#8250;</span>
        <a href="javascript:history.back()" id="breadcrumb-subject">Subject</a>
        <span>&#8250;</span>
        <span id="breadcrumb-chapter">Chapter</span>
      </div>

      <!-- Content Tabs -->
      <div class="content-tabs" style="margin: 20px 0;">
        <button class="content-tab active" id="tab-content-btn" onclick="switchTab('content')">&#128196; Content</button>
        <button class="content-tab" id="tab-interactive-btn" onclick="switchTab('quiz')">&#9889; Interactive Quiz</button>
      </div>

      <!-- Content Body -->
      <div id="tab-content" class="tab-content">
        <div class="content-viewer" id="content-viewer">
          <div class="content-body" id="content-body">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Quiz Section -->
      <div id="tab-interactive" class="tab-content" style="display:none;">
        <div class="quiz-container" id="quiz-container">
          <!-- Rendered by JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 TopicGuru by Shikhan Sagar Team. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/app.js"></script>
</body>
</html>
