<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopicGuru – Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../images/icon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="../index.html" class="nav-logo">
      <img src="../images/icon.png" alt="TopicGuru">
      <span>Topic<span class="highlight">Guru</span></span>
    </a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="hamburger" onclick="toggleMobileMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="../images/icon.png" alt="TopicGuru">
        <h2>Create Account &#128640;</h2>
        <p class="auth-subtitle">Join TopicGuru and start learning</p>
      </div>

      <form onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" placeholder="Enter mobile number" required>
        </div>
        <div class="form-group">
          <label>Email (Optional)</label>
          <input type="email" placeholder="Enter email address">
        </div>
        <div class="form-group">
          <label>Select Class</label>
          <select required>
            <option value="">-- Select Class --</option>
            <option value="6">&#2727;&#2763;&#2736;&#2723; 6 (Class 6)</option>
            <option value="7">&#2727;&#2763;&#2736;&#2723; 7 (Class 7)</option>
            <option value="8">&#2727;&#2763;&#2736;&#2723; 8 (Class 8)</option>
            <option value="9">&#2727;&#2763;&#2736;&#2723; 9 (Class 9)</option>
            <option value="10">&#2727;&#2763;&#2736;&#2723; 10 (Class 10)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Create a password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-large" style="width:100%;justify-content:center;">Sign Up</button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Login</a>
      </div>

      <div style="text-align:center;margin-top:25px;padding-top:20px;border-top:1px solid var(--border-color);">
        <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:10px;">Or sign up with</p>
        <button class="btn btn-outline" style="color:var(--text-primary);border-color:var(--border-color);width:100%;justify-content:center;">
          &#127312; Sign up with Google
        </button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
