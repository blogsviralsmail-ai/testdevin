<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopicGuru – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../images/icon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="../index.html" class="nav-logo">
      <img src="../images/icon.png" alt="TopicGuru">
      <span>Topic<span class="highlight">Guru</span></span>
    </a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="hamburger" onclick="toggleMobileMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Auth Container -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="../images/icon.png" alt="TopicGuru">
        <h2>Welcome Back! &#128075;</h2>
        <p class="auth-subtitle">Login to continue learning</p>
      </div>

      <form onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label>Mobile Number / Email</label>
          <input type="text" placeholder="Enter mobile number or email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" required>
        </div>
        <div style="text-align:right;margin-bottom:20px;">
          <a href="#" style="color:var(--primary);font-size:0.85rem;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-large" style="width:100%;justify-content:center;">Login</button>
      </form>

      <div class="auth-link">
        Don't have an account? <a href="register.html">Sign Up</a>
      </div>

      <div style="text-align:center;margin-top:25px;padding-top:20px;border-top:1px solid var(--border-color);">
        <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:10px;">Or continue with</p>
        <button class="btn btn-outline" style="color:var(--text-primary);border-color:var(--border-color);width:100%;justify-content:center;">
          &#127312; Continue with Google
        </button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
