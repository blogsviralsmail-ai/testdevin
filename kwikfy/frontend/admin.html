<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel — Kwikfy</title>
<link rel="icon" type="image/png" href="/kwikfy-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(800px at 50% 20%,#312e81 0,transparent 60%),#080b18}
.login-card{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:380px;color:#0f172a;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-card .sub{color:#64748b;font-size:13px;margin-bottom:20px}
.login-card label{display:block;font-size:12px;font-weight:600;color:#334155;margin:12px 0 4px}
.login-card input{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none}
.login-card input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.btn{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.5}
.err{color:#dc2626;font-size:12px;margin-top:8px;display:none}
.top{background:#1e293b;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155}
.top h2{font-size:18px;font-weight:700}
.top .logout{background:#ef4444;color:#fff;border:0;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.dash{display:none}
.container{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat{background:#1e293b;border-radius:14px;padding:20px;border:1px solid #334155}
.stat .num{font-size:28px;font-weight:800;color:#6366f1}
.stat .label{font-size:12px;color:#94a3b8;margin-top:4px}
.section{background:#1e293b;border-radius:14px;padding:20px;border:1px solid #334155;margin-bottom:20px}
.section h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:#94a3b8;font-weight:600;border-bottom:1px solid #334155;font-size:11px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid #1e293b;color:#cbd5e1}
tr:hover td{background:rgba(99,102,241,.05)}
.badge{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-free{background:#1e293b;color:#94a3b8}
.badge-growth{background:#164e63;color:#22d3ee}
.badge-pro{background:#3730a3;color:#a5b4fc}
.badge-enterprise{background:#4c1d95;color:#c4b5fd}
.badge-active{background:#064e3b;color:#34d399}
.badge-inactive{background:#7f1d1d;color:#fca5a5}
.actions{display:flex;gap:6px}
.actions button{padding:4px 10px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit}
.actions button:hover{color:#fff;border-color:#6366f1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:100}
.modal-overlay.on{display:grid}
.modal{background:#1e293b;border-radius:16px;padding:24px;width:90%;max-width:420px;border:1px solid #334155}
.modal h3{margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin:10px 0 4px}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid #334155;border-radius:8px;font-size:13px;font-family:inherit;background:#0f172a;color:#e2e8f0;outline:none}
.modal .btn{margin-top:14px}
.modal .close{float:right;background:none;border:0;color:#94a3b8;cursor:pointer;font-size:18px}
.search{padding:8px 14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:#e2e8f0;font-size:13px;width:300px;outline:none;font-family:inherit}
.search:focus{border-color:#6366f1}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
</style>
</head><body>
<div class="login-wrap" id="loginWrap">
<div class="login-card">
<h1>Admin Panel</h1>
<p class="sub">Sign in with admin credentials</p>
<form id="loginForm">
<label>Email</label><input id="aem" type="email" placeholder="admin@kwikfy.com" required>
<label>Password</label><input id="apw" type="password" placeholder="********" required>
<button class="btn" id="abtn" type="submit">Sign in</button>
<div class="err" id="aerr"></div>
</form>
</div>
</div>
<div class="dash" id="dashWrap">
<div class="top"><h2>Kwikfy Admin</h2><button class="logout" onclick="doLogout()">Logout</button></div>
<div class="container">
<div class="stats" id="statsGrid"></div>
<div class="section">
<div class="toolbar">
<h3>Users</h3>
<input class="search" id="userSearch" placeholder="Search by email, name or brand..." onkeyup="searchUsers()">
</div>
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Brand</th><th>Plan</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
<tbody id="usersBody"></tbody>
</table>
</div>
<div class="section">
<h3>Announcements</h3>
<button class="btn" style="width:auto;margin:0 0 12px;padding:6px 16px;font-size:12px" onclick="showAnnModal()">+ New Announcement</button>
<div id="annList"></div>
</div>
</div>
</div>
<div class="modal-overlay" id="billingModal">
<div class="modal">
<button class="close" onclick="closeBilling()">&times;</button>
<h3>Update User Plan</h3>
<input type="hidden" id="bUserId">
<label>Plan</label>
<select id="bPlan"><option value="free">Free</option><option value="growth">Growth</option><option value="pro">Pro</option><option value="enterprise">Enterprise</option></select>
<label>Features (comma-separated)</label>
<input id="bFeatures" placeholder="inventory,analytics,finance,cashflow,ndr,alerts,whatsapp,team,reports">
<button class="btn" onclick="saveBilling()">Save</button>
</div>
</div>
<div class="modal-overlay" id="annModal">
<div class="modal">
<button class="close" onclick="closeAnn()">&times;</button>
<h3>New Announcement</h3>
<label>Title</label><input id="annTitle" placeholder="Announcement title">
<label>Body</label><input id="annBody" placeholder="Details...">
<label>Type</label>
<select id="annType"><option value="info">Info</option><option value="warning">Warning</option><option value="success">Success</option></select>
<button class="btn" onclick="saveAnn()">Post</button>
</div>
</div>
<script>
var TOK=localStorage.getItem('admin_token');
if(TOK)showDash();else showLogin();
function showLogin(){document.getElementById('loginWrap').style.display='';document.getElementById('dashWrap').style.display='none';}
function showDash(){document.getElementById('loginWrap').style.display='none';document.getElementById('dashWrap').style.display='';loadStats();loadUsers();loadAnn();}
document.getElementById('loginForm').onsubmit=function(e){
e.preventDefault();var b=document.getElementById('abtn'),er=document.getElementById('aerr');
b.disabled=true;b.textContent='Signing in...';er.style.display='none';
fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('aem').value.trim(),password:document.getElementById('apw').value})})
.then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
.then(function(x){if(x.s===200&&x.d.access_token){localStorage.setItem('admin_token',x.d.access_token);TOK=x.d.access_token;showDash();}else{er.textContent=x.d.detail||'Login failed';er.style.display='block';}b.disabled=false;b.textContent='Sign in';})
.catch(function(){er.textContent='Connection error';er.style.display='block';b.disabled=false;b.textContent='Sign in';});
};
function api(path,opts){opts=opts||{};opts.headers=Object.assign({'Authorization':'Bearer '+TOK},opts.headers||{});return fetch(path,opts).then(function(r){if(r.status===401){doLogout();throw 0;}return r.json();});}
function doLogout(){localStorage.removeItem('admin_token');TOK=null;showLogin();}
function loadStats(){
api('/api/admin/stats').then(function(d){
var h='';
h+='<div class="stat"><div class="num">'+d.total_users+'</div><div class="label">Total Users</div></div>';
h+='<div class="stat"><div class="num">'+d.active_users+'</div><div class="label">Active Users</div></div>';
h+='<div class="stat"><div class="num">'+d.paid_users+'</div><div class="label">Paid Users</div></div>';
h+='<div class="stat"><div class="num">'+d.free_users+'</div><div class="label">Free Users</div></div>';
if(d.plans){
h+='<div class="stat"><div class="num">'+d.plans.growth+'</div><div class="label">Growth Plan</div></div>';
h+='<div class="stat"><div class="num">'+d.plans.pro+'</div><div class="label">Pro Plan</div></div>';
h+='<div class="stat"><div class="num">'+d.plans.enterprise+'</div><div class="label">Enterprise Plan</div></div>';
}
document.getElementById('statsGrid').innerHTML=h;
}).catch(function(){});
}
var allUsers=[];
function loadUsers(search){
var url='/api/admin/users?limit=200';if(search)url+='&search='+encodeURIComponent(search);
api(url).then(function(d){allUsers=d.users||[];renderUsers();}).catch(function(){});
}
function renderUsers(){
var h='';allUsers.forEach(function(u){
var dt=u.created_at?new Date(u.created_at).toLocaleDateString():'—';
h+='<tr>';
h+='<td>'+u.id+'</td>';
h+='<td>'+(u.name||'—')+'</td>';
h+='<td>'+u.email+'</td>';
h+='<td>'+(u.brand||'—')+'</td>';
h+='<td><span class="badge badge-'+u.plan+'">'+(u.plan||'free')+'</span></td>';
h+='<td><span class="badge badge-'+(u.is_active!==false?'active':'inactive')+'">'+(u.is_active!==false?'Active':'Inactive')+'</span></td>';
h+='<td>'+dt+'</td>';
h+='<td class="actions">';
h+='<button onclick="openBilling('+u.id+',\''+u.plan+'\')">Plan</button>';
h+='<button onclick="toggleStatus('+u.id+','+(u.is_active!==false?'false':'true')+')">'+(u.is_active!==false?'Deactivate':'Activate')+'</button>';
h+='<button onclick="impersonate('+u.id+')">Login as</button>';
h+='</td></tr>';
});
document.getElementById('usersBody').innerHTML=h||'<tr><td colspan="8" style="text-align:center;color:#64748b">No users found</td></tr>';
}
var searchTimer;
function searchUsers(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadUsers(document.getElementById('userSearch').value);},300);}
function openBilling(uid,plan){
document.getElementById('bUserId').value=uid;
document.getElementById('bPlan').value=plan||'free';
document.getElementById('bFeatures').value='inventory,analytics,finance,cashflow,ndr,alerts,whatsapp,team,reports';
document.getElementById('billingModal').classList.add('on');
}
function closeBilling(){document.getElementById('billingModal').classList.remove('on');}
function saveBilling(){
var uid=document.getElementById('bUserId').value;
var plan=document.getElementById('bPlan').value;
var feats=document.getElementById('bFeatures').value.split(',').map(function(f){return f.trim()}).filter(Boolean);
api('/api/admin/billing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:parseInt(uid),plan:plan,features:feats})})
.then(function(){closeBilling();loadUsers();loadStats();}).catch(function(){});
}
function toggleStatus(uid,active){
api('/api/admin/user-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,is_active:active})})
.then(function(){loadUsers();}).catch(function(){});
}
function impersonate(uid){
api('/api/admin/impersonate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid})})
.then(function(d){if(d.access_token){localStorage.setItem('token',d.access_token);localStorage.setItem('username',d.username||'');window.open('/dashboard','_blank');}}).catch(function(){});
}
function loadAnn(){
api('/api/admin/announcements').then(function(d){
var anns=d.announcements||[];
if(!anns.length){document.getElementById('annList').innerHTML='<p style="color:#64748b;font-size:13px">No announcements yet</p>';return;}
var h='';anns.forEach(function(a){
h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #334155">';
h+='<div><b>'+a.title+'</b> <span class="badge badge-'+(a.type==='warning'?'growth':'active')+'">'+a.type+'</span><br><small style="color:#64748b">'+(a.body||'')+'</small></div>';
h+='<button style="background:none;border:0;color:#ef4444;cursor:pointer;font-size:16px" onclick="delAnn('+a.id+')">&times;</button>';
h+='</div>';
});
document.getElementById('annList').innerHTML=h;
}).catch(function(){});
}
function showAnnModal(){document.getElementById('annModal').classList.add('on');}
function closeAnn(){document.getElementById('annModal').classList.remove('on');}
function saveAnn(){
var t=document.getElementById('annTitle').value,b=document.getElementById('annBody').value,ty=document.getElementById('annType').value;
if(!t)return;
api('/api/admin/announcements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,body:b,type:ty})})
.then(function(){closeAnn();loadAnn();document.getElementById('annTitle').value='';document.getElementById('annBody').value='';}).catch(function(){});
}
function delAnn(id){
api('/api/admin/announcements/'+id,{method:'DELETE'}).then(function(){loadAnn();}).catch(function(){});
}
</script>
</body></html>
