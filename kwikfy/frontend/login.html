<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Kwikfy</title>
<link rel="icon" type="image/png" href="/kwikfy-icon.png"><link rel="apple-touch-icon" href="/kwikfy-icon.png">
<meta name="theme-color" content="#0f1830">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 8% -10%,#312e81 0,transparent 50%),radial-gradient(1000px 520px at 112% 112%,#7c3aed 0,transparent 45%),#080b18;color:#0f172a}
.card{width:100%;max-width:404px;background:#fff;border-radius:24px;padding:40px 36px;box-shadow:0 40px 90px rgba(2,6,23,.55);margin:20px}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.logo .mark{width:40px;height:40px;border-radius:12px;background:url('/kwikfy-icon.png') center/cover no-repeat;box-shadow:0 10px 24px rgba(2,6,23,.35)}
.logo .nm{font-weight:900;font-size:21px;letter-spacing:-.03em}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sub{color:#64748b;font-size:14px;margin-bottom:26px}
label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;transition:.15s;outline:none}
input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.btn{width:100%;margin-top:24px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;transition:.15s;box-shadow:0 12px 26px rgba(99,102,241,.4)}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed}
.err{color:#dc2626;font-size:13px;margin-top:12px;min-height:18px}
.foot{margin-top:22px;text-align:center;font-size:13px;color:#64748b}.foot a{color:#6366f1;font-weight:600;text-decoration:none}
</style></head><body>
<div class="card">
  <div class="logo"><div class="mark"></div><div class="nm">Kwikfy</div></div>
  <h1>Welcome back</h1><div class="sub">Sign in to your dashboard</div>
  <form id="f"><label>Email</label><input id="em" type="email" placeholder="you@store.com" required autofocus>
  <label>Password</label><input id="pw" type="password" placeholder="********" required>
  <button class="btn" id="b" type="submit">Sign in</button><div class="err" id="er"></div></form>
  <div class="foot">New here? <a href="/signup">Create an account</a></div>
</div>
<script>
var f=document.getElementById('f'),b=document.getElementById('b'),er=document.getElementById('er');
f.addEventListener('submit',function(e){e.preventDefault();er.textContent='';b.disabled=true;b.textContent='Signing in...';
 fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('em').value.trim(),password:document.getElementById('pw').value})})
 .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
 .then(function(x){if(x.s===200&&x.d.access_token){localStorage.setItem('token',x.d.access_token);localStorage.setItem('username',x.d.username||'');location.href='/dashboard';}else{er.textContent=(x.d&&x.d.detail)||'Invalid email or password';b.disabled=false;b.textContent='Sign in';}})
 .catch(function(){er.textContent='Network error';b.disabled=false;b.textContent='Sign in';});});
</script></body></html>
