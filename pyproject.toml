[project]
name = "seedance-video-generator"
version = "1.0.0"
description = "Cloud-based Seedance video generator with batch processing and reference image support"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
